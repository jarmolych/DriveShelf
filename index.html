  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(menuClose){const b=menuBtn;closeMenu();if(b)b.focus();return}if(noteTarget)closeNote();else if(!$('#drvDrawer').hidden)closeDriveEditor();else if(!$('#multiDrawer').hidden)closeMulti();else if(!$('#setDrawer').hidden)$('#setDrawer').hidden=true;else if(!$('#bkDrawer').hidden)$('#bkDrawer').hidden=true;else if(baySel.size){baySel.clear();renderBays()}});
  let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(U.width==='auto')applyUI();layoutGrid()},150)});
}
function addDrive(id,gb,type,sn,make,ff){
  id=(id||'').trim().slice(0,24);
  if(!id){let n=S.drives.length+1;do{id='D'+String(n++).padStart(2,'0')}while(drive(id))}
  const base=id;let k=2;while(drive(id))id=base+'-'+k++;
  S.drives.push({id,gb:gb>0?gb:null,type:type==='SSD'||type==='HDD'?type:null,make:(make||'').trim().slice(0,10),sn:(sn||'').trim().toUpperCase().slice(0,8),v:null,...(FF[ff]?{ff}:{})});return id;
}

/* ================= setup: what are you planning? ================= */
const SETUP_KEY='driveshelf.setup';
let suRows=null,suFirst=false;
const hasOwnData=()=>!S.example&&(S.drives.length>0||S.vdevs.length>0);
function openSetup(first){suFirst=!!first;suRows=null;closeMenu();renderSetup(1);$('#setup').hidden=false;const o=$('#setup .su-opt');if(o)o.focus()}
function closeSetup(){$('#setup').hidden=true}
function dismissSetup(){if(suFirst)lsSet(SETUP_KEY,{kind:'example',at:Date.now()});closeSetup()}
function renderSetup(step){
  const box=$('#setupBox'),keep=hasOwnData(),close=`<button type="button" class="icon-btn ghost" id="suClose" aria-label="Close">${XI}</button>`;
  if(step===1){
    box.innerHTML=`<div class="su-head"><div><div class="eyebrow">${suFirst?'Welcome to DriveShelf':'Setup'}</div><h2 id="suTitle">What are you planning?</h2></div>${close}</div>
      <p class="note">${suFirst?'Pick what fits. You can add or remove servers any time, and change this later in Settings.':keep?'Your drives, vdevs, pools and notes are kept. Drives in bays go back on the shelf.':'You can add or remove servers any time.'}</p>
      <div class="su-opts">
        <button type="button" class="su-opt" data-su="drives"><span class="ic">${IC.inv}</span><b>Just my drives</b><small>Keep an inventory of your drives and plan RAID pools. No servers or bays.</small></button>
        <button type="button" class="su-opt" data-su="servers"><span class="ic">${IC.bays}</span><b>One or more servers</b><small>Plan which drive goes in which bay, for a NAS, a server or a whole rack. Start from templates like the Dell PowerEdge T320.</small></button>
        <button type="button" class="su-opt" data-su="example"><span class="ic">${IC.combos}</span><b>${suFirst?'Show me an example':'Load the example'}</b><small>${suFirst?'Look around with sample data: two servers and 14 drives.':'Replaces everything with the sample data. You can undo it.'}</small></button>
      </div>
      <div class="su-foot"><button type="button" class="link" id="suFile">Load a saved .json file instead</button></div>`;
    return;
  }
  if(!suRows)suRows=S.servers.length&&!S.example?S.servers.map(s=>({name:s.name,n:s.n,tpl:''})):[{name:'Server 1',n:8,tpl:''}];
  box.innerHTML=`<div class="su-head"><div><div class="eyebrow">Setup · servers</div><h2 id="suTitle">Add your servers</h2></div>${close}</div>
    <p class="note">Pick a template or type a name and bay count. You can change all of this later on each server's panel.</p>
    <div class="su-rows">${suRows.map((r,i)=>`<div class="su-row" data-row="${i}"><select class="su-tpl" aria-label="Template for server ${i+1}"><option value="">Template…</option>${tplOptions(r.tpl)}</select><input class="su-name" value="${esc(r.name)}" maxlength="40" aria-label="Name of server ${i+1}" spellcheck="false"><input class="su-n" type="number" min="1" max="${MAXB}" value="${r.n}" aria-label="Bays in server ${i+1}"><button type="button" class="icon-btn ghost su-del" aria-label="Remove server ${i+1}" ${suRows.length>1?'':'disabled'}>${XI}</button></div>`).join('')}</div>
    <div class="su-foot"><button type="button" class="ghost sm" id="suAdd" ${suRows.length>=MAXS?'disabled':''}>+ Add another server</button><span class="grow"></span><button type="button" class="ghost" id="suBack">Back</button><button type="button" class="primary" id="suGo">Start planning</button></div>`;
}
function syncRows(){
  suRows=[...$('#setupBox').querySelectorAll('.su-row')].map((row,i)=>({name:row.querySelector('.su-name').value.trim().slice(0,40)||`Server ${i+1}`,
    n:clamp(Math.round(+row.querySelector('.su-n').value)||8,1,MAXB),tpl:row.querySelector('.su-tpl').value}));
}
function applySetup(kind,rows){
  const keep=hasOwnData();
  closeSetup();lsSet(SETUP_KEY,{kind,at:Date.now()});
  undoable(()=>{
    if(kind==='example')S=sample();
    else{
      const servers=(rows||[]).slice(0,MAXS).map((r,i)=>({id:newId(),name:r.name||`Server ${i+1}`,n:clamp(r.n,1,MAXB),cols:0}));
      const st=keep?clone(S):emptyState([]);
      st.servers=servers;st.bays=Array(servers.reduce((a,s)=>a+s.n,0)).fill(null);S=st;
    }
    picked=null;sel.clear();baySel.clear();
    if(kind==='example')return 'Loaded the example.';
    if(kind==='drives')return `Set up as a drives-only inventory.${keep?' Your drives and pools are kept.':''}`;
    return `Set up ${rows.length} server${rows.length===1?'':'s'}.${keep?' Your drives and pools are kept, and drives in bays went back on the shelf.':''}`;
  });
  if(kind==='example'){S.example=true;lsSet(KEY,S)}
  U.hidden.bays=kind==='drives';layoutGrid();saveU();
  goSection(kind==='drives'?'inv':'bays');
}
function initSetup(){
  const wrap=$('#setup'),box=$('#setupBox');
  box.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='suClose')return dismissSetup();
    if(b.dataset.su==='drives')return applySetup('drives',[]);
    if(b.dataset.su==='example')return applySetup('example');
    if(b.dataset.su==='servers'){renderSetup(2);const n=box.querySelector('.su-name');if(n)n.focus();return}
    if(b.id==='suFile'){dismissSetup();$('#cfgFile').click();return}
    if(b.id==='suBack'){syncRows();renderSetup(1);return}
    if(b.id==='suAdd'){syncRows();suRows.push({name:`Server ${suRows.length+1}`,n:8,tpl:''});renderSetup(2);const ns=box.querySelectorAll('.su-name');ns[ns.length-1].select();return}
    if(b.classList.contains('su-del')){syncRows();suRows.splice(+b.closest('.su-row').dataset.row,1);renderSetup(2);return}
    if(b.id==='suGo'){syncRows();applySetup('servers',suRows)}
  });
  box.addEventListener('change',e=>{
    if(!e.target.matches('.su-tpl')||!e.target.value)return;
    const row=e.target.closest('.su-row'),[n,nm]=e.target.value.split('|');
    row.querySelector('.su-n').value=n;if(nm)row.querySelector('.su-name').value=nm;
  });
  wrap.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();dismissSetup()}});
  wrap.addEventListener('pointerdown',e=>{if(e.target===wrap)dismissSetup()});
}

/* ================= startup ================= */
(function start(){
  const lu=lsGet(UKEY);U=validU(lu);
  applyUI();buildShell();bindStatic();layoutGrid();
  const localState=valid(lsGet(KEY));
  if(DEFAULT_CFG&&Array.isArray(DEFAULT_CFG.layouts))cfgLayouts=DEFAULT_CFG.layouts.filter(l=>l&&typeof l.name==='string'&&valid(l.state));
  S=localState||sample();render();
  initSetup();
  if(!localState&&!lsGet(SETUP_KEY))openSetup(true);
})();
</script>

</body></html>
